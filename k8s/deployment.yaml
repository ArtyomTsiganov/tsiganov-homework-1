apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: homework-1
  template:
    metadata:
      labels:
        app: homework-1
    spec:
      containers:
        - name: homework-1
          image: localhost:5001/tsiganov-homework:v2.0
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "500m"
              memory: "1024Mi"
              ephemeral-storage: "256Mi"
          envFrom:
            - configMapRef:
                name: homework-1-config
          env:
            - name: APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homework-1-credentials
                  key: APP_TOKEN